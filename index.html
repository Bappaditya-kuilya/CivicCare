    <script>
      (function () {
        window.addEventListener('error', function (event) {
          var src = (event && event.filename) || '';
          var msg = (event && event.message) || '';
          if (src.indexOf('@vite/client') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 || msg.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = String((event && event.reason && (event.reason.stack || event.reason.message || event.reason)) || '');
          if (reason.indexOf('@vite/client') !== -1 || reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 || reason.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
